server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location = /registerSW.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # Worker-ul MapLibre (vezi `maplibreWorker()` din `vite.config.ts`).
    #
    # De ce un `location` propriu: `mime.types` din imaginea nginx mapează doar `js`, iar restul ajunge
    # la `default_type application/octet-stream`. Un worker de tip `module` este **refuzat** de browser
    # dacă nu vine cu un tip JavaScript, deci harta ar rămîne goală exact în producție, deși merge pe
    # `vite preview` (care pune tipul corect). Verificat: `grep mjs /etc/nginx/mime.types` în container
    # nu găsește nimic.
    location /maplibre-worker/ {
        default_type text/javascript;
        # Fișierele sînt legate de versiunea MapLibre, deci se pot cache-ui agresiv.
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback — Vue Router history mode.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API-ul rămîne al aplicației TTR: aplicația de hartă e un al doilea client al aceluiași backend,
    # cu același cont. În dezvoltare, `vite` face același proxy (vezi `server.proxy`).
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }

    location /hubs/ {
        access_log off;
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}
