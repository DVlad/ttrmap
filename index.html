<!DOCTYPE html>
<html lang="ro">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <!--
      `viewport-fit=cover` nu e opțional: fără el `env(safe-area-inset-*)` întoarce **0** în orice
      WebView tras peste barele de sistem. Androidul (Capacitor 8) rulează edge-to-edge, deci fără
      `cover` bara de sus a shell-ului intră sub ceasul și bateria telefonului. Aplicația asta e cea
      care ajunge pe telefon (hărți offline), deci contractul contează mai mult aici decît în TTR.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0d0f12">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="/pwa-192x192.png">
    <title>TTR Hartă</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
